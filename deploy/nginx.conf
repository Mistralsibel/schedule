# Chrono 日程 - Nginx 配置示例
# 用法: 复制到 /etc/nginx/conf.d/schedule.conf (或宝塔面板 → 网站 → 配置文件)
server {
    listen 80;
    # 换成你的域名; 若暂无域名可直接写服务器公网 IP
    server_name schedule.example.com;

    # 网站根目录 (与 deploy.bat 中的 REMOTE_DIR 保持一致)
    root /var/www/schedule;
    index index.html;

    # 静态资源缓存 (JS/图片等, 30天)
    location ~* \.(js|png|jpg|webp|mp3)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip 压缩 (three.min.js 669KB / xlsx.full.min.js 881KB 提速明显)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
